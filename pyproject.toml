[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "math-modeling-paper-review-agent"
version = "0.1.0"
description = "Local-first evidence-based review service for mathematical modeling papers"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.4,<3",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.9,<1",
  "PyMuPDF>=1.24,<2",
  "PyYAML>=6,<7",
  "cryptography>=43,<48",
  "SQLAlchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
desktop = [
  "pywebview>=5.4,<7",
  "pyinstaller>=6.8,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["backend*"]
