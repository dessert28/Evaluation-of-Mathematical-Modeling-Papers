<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数学建模论文评审工作台</title>
  <style>
    body{font:16px "Microsoft YaHei",sans-serif;background:#10131b;color:#f3f4f6;margin:0;min-height:100vh;display:grid;place-items:center}
    main{width:min(540px,calc(100vw - 48px));padding:32px;border:1px solid #303747;border-radius:16px;background:#191e29;box-sizing:border-box}
    h1{font-size:23px;margin:0 0 12px}p{line-height:1.7;color:#aeb7c7}button{display:block;width:100%;padding:13px;margin-top:12px;border-radius:9px;border:1px solid #52617a;background:#252e3d;color:white;font-size:15px;cursor:pointer}button.primary{background:#3867d6;border-color:#3867d6}button:disabled{opacity:.6;cursor:wait}#status{min-height:25px;color:#b7c5de}
  </style>
</head>
<body>
  <main>
    <h1>欢迎使用数学建模论文评审工作台</h1>
    <p>可以迁移已有的本地数据，或创建一个新的工作区。迁移会复制数据库、模型配置和论文文件，原目录不会被修改。迁移前请先关闭使用该数据目录的旧版工作台。</p>
    <button class="primary" id="migrate">迁移已有数据</button>
    <button id="fresh">创建新工作区</button>
    <p id="status" role="status"></p>
  </main>
  <script>
    const statusNode = document.getElementById('status')
    const buttons = [...document.querySelectorAll('button')]
    async function start(mode) {
      buttons.forEach(button => button.disabled = true)
      statusNode.textContent = '正在准备本地工作区并启动服务…'
      try {
        const result = await window.pywebview.api.startup(mode)
        if (!result?.ok) throw new Error(result?.message || '启动失败')
      } catch (error) {
        statusNode.textContent = error?.message || '启动失败，请重新打开应用。'
        buttons.forEach(button => button.disabled = false)
      }
    }
    document.getElementById('fresh').addEventListener('click', () => start('fresh'))
    document.getElementById('migrate').addEventListener('click', () => start('migrate'))
    window.addEventListener('pywebviewready', () => { statusNode.textContent = '请选择如何准备数据。' })
  </script>
</body>
</html>
